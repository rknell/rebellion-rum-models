name: Pre-commit autofix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Feature branch to update (main is not allowed)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pre-commit-autofix-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Generate, commit, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Reject protected branch
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "::error::Autofix must run against a feature branch, not main."
            exit 1
          fi

      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --enforce-lockfile

      - name: Generate and format
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format .

      - name: Create autofix commit
        id: autofix
        run: |
          if git diff --quiet --exit-code && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply generated pre-commit changes"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Push autofix commit
        if: steps.autofix.outputs.created == 'true'
        env:
          BRANCH_NAME: ${{ inputs.branch }}
        run: git push origin "HEAD:$BRANCH_NAME"
